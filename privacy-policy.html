<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#101936">

    <meta name="description"
          content="Read the official SmartAlphaX Learning App Privacy Policy. Learn how we handle children's privacy, parental controls, Firebase data, advertising and account deletion.">

    <meta name="robots" content="index, follow">

    <title>Privacy Policy | SmartAlphaX — Learning App</title>

    <link rel="icon"
          href="https://www.gstatic.com/images/branding/product/1x/google_play_512dp.png">

    <style>
        :root {
            --bg: #f5f7fc;
            --surface: #ffffff;
            --navy: #101936;
            --navy-light: #18254a;
            --primary: #5145e5;
            --primary-light: #eeedff;
            --text: #202944;
            --muted: #68738d;
            --border: #e5e9f2;
            --green: #12805c;
            --green-light: #e8f8f0;
            --orange: #a65b13;
            --orange-light: #fff4e5;
            --shadow: 0 16px 50px rgba(20, 35, 75, 0.07);
            --radius: 22px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 100px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, Helvetica, Arial,
                         sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.75;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        button {
            font: inherit;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(16, 25, 54, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.09);
        }

        .nav {
            max-width: 1180px;
            margin: auto;
            padding: 13px 24px;
            min-height: 74px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            text-decoration: none;
            min-width: 0;
        }

        .brand:hover {
            text-decoration: none;
        }

        .brand-icon {
            width: 43px;
            height: 43px;
            flex-shrink: 0;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #776bff, #4036cb);
            box-shadow: 0 6px 20px rgba(81, 69, 229, 0.3);
            font-size: 22px;
        }

        .brand-name {
            font-size: 18px;
            line-height: 1.25;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            color: #b9c3e0;
            font-size: 11px;
            letter-spacing: 1.1px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            color: white;
            font-size: 13px;
            font-weight: 650;
            padding: 10px 14px;
            border-radius: 11px;
            border: 1px solid rgba(255,255,255,0.15);
            white-space: nowrap;
            transition: 0.2s ease;
        }

        .nav-link:hover {
            background: rgba(255,255,255,0.09);
            text-decoration: none;
        }

        .nav-link.primary {
            background: white;
            color: var(--navy);
            border-color: white;
        }

        .nav-link.primary:hover {
            background: #e9ecff;
        }

        .hero {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 90% 15%,
                    rgba(117, 102, 255, 0.25),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 5% 100%,
                    rgba(46, 123, 238, 0.17),
                    transparent 35%
                ),
                linear-gradient(135deg, #101936 0%, #182653 100%);
            color: white;
        }

        .hero-inner {
            max-width: 1180px;
            margin: auto;
            padding: 68px 24px 82px;
            position: relative;
            z-index: 1;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #c5cdef;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 32px;
        }

        .back-link:hover {
            color: white;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(179, 190, 255, 0.25);
            background: rgba(255,255,255,0.06);
            color: #d9ddff;
            border-radius: 999px;
            padding: 7px 13px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.3px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(34px, 5vw, 57px);
            line-height: 1.13;
            letter-spacing: -1.8px;
            max-width: 780px;
            font-weight: 850;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #aaa4ff;
        }

        .hero-description {
            max-width: 720px;
            color: #d0d8f0;
            font-size: 16px;
            line-height: 1.85;
        }

        .hero-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 27px;
        }

        .meta-pill {
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.11);
            color: #e0e5f7;
            font-size: 12px;
        }

        .meta-pill strong {
            color: white;
        }

        .container {
            max-width: 1180px;
            margin: -35px auto 0;
            padding: 0 24px 65px;
            position: relative;
            z-index: 2;
        }

        .highlights {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 17px;
            margin-bottom: 30px;
        }

        .highlight-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 23px;
            box-shadow: var(--shadow);
        }

        .highlight-icon {
            width: 43px;
            height: 43px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            font-size: 21px;
            margin-bottom: 15px;
        }

        .icon-purple {
            background: var(--primary-light);
        }

        .icon-green {
            background: var(--green-light);
        }

        .icon-orange {
            background: var(--orange-light);
        }

        .highlight-card h3 {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 7px;
            letter-spacing: -0.2px;
        }

        .highlight-card p {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.75;
        }

        .notice {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            background: #f0f3ff;
            border: 1px solid #dfe4ff;
            border-radius: 16px;
            padding: 19px 21px;
            margin-bottom: 27px;
        }

        .notice-icon {
            font-size: 22px;
            flex-shrink: 0;
        }

        .notice h3 {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .notice p {
            color: #596581;
            font-size: 13px;
            line-height: 1.8;
        }

        .layout {
            display: grid;
            grid-template-columns: 255px minmax(0, 1fr);
            gap: 25px;
            align-items: start;
        }

        .sidebar {
            position: sticky;
            top: 98px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 19px;
            padding: 20px 15px;
            box-shadow: 0 8px 30px rgba(20,35,75,0.035);
        }

        .sidebar-title {
            font-size: 11px;
            font-weight: 850;
            color: #8790a7;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            padding: 0 10px;
            margin-bottom: 12px;
        }

        .toc {
            list-style: none;
        }

        .toc li {
            margin-bottom: 3px;
        }

        .toc a {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 9px 10px;
            color: #606c85;
            border-radius: 9px;
            font-size: 12px;
            line-height: 1.55;
            transition: 0.2s ease;
        }

        .toc a:hover {
            color: var(--primary);
            background: #f5f4ff;
            text-decoration: none;
        }

        .toc-number {
            font-size: 11px;
            font-weight: 850;
            color: #8b83ef;
            min-width: 17px;
            padding-top: 1px;
        }

        .policy-content {
            min-width: 0;
        }

        .policy-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 29px;
            margin-bottom: 19px;
            box-shadow: 0 7px 27px rgba(20,35,75,0.025);
            scroll-margin-top: 100px;
        }

        .section-heading {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 19px;
        }

        .section-number {
            flex-shrink: 0;
            width: 39px;
            height: 39px;
            display: grid;
            place-items: center;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 850;
        }

        .section-heading h2 {
            color: var(--navy);
            font-size: 21px;
            line-height: 1.4;
            letter-spacing: -0.45px;
            font-weight: 800;
        }

        .section-description {
            color: var(--muted);
            font-size: 13px;
            margin-top: 4px;
        }

        .policy-section p {
            color: #536079;
            font-size: 14px;
            margin-bottom: 14px;
        }

        .policy-section p:last-child {
            margin-bottom: 0;
        }

        .policy-section h3 {
            color: #27334f;
            font-size: 15px;
            margin: 21px 0 9px;
            font-weight: 800;
        }

        .policy-section h3:first-child {
            margin-top: 0;
        }

        .policy-section ul {
            padding-left: 22px;
            margin: 12px 0 17px;
        }

        .policy-section li {
            color: #536079;
            font-size: 14px;
            padding-left: 4px;
            margin-bottom: 10px;
        }

        .policy-section li::marker {
            color: #8177ef;
        }

        .info-table-wrap {
            overflow-x: auto;
            margin: 18px 0;
            border: 1px solid var(--border);
            border-radius: 13px;
        }

        .info-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 450px;
            font-size: 13px;
        }

            text-align: left;
            color: #445
